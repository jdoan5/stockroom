name: image

# Builds the web app into a container image and pushes it to GitHub's container
# registry (ghcr.io/jdoan5/stockroom), the same way vela-commerce does. Azure
# Container Apps pulls the image from there. No Dockerfile: the .NET SDK builds
# the image itself with /t:PublishContainer.

on:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        run: >-
          dotnet publish src/Stockroom.Web/Stockroom.Web.csproj
          --configuration Release --os linux --arch x64
          /t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=jdoan5/stockroom
          -p:ContainerImageTags='"latest;${{ github.sha }}"'
          -p:PublishRepositoryUrl=true

      - name: Summary
        run: echo "Pushed ghcr.io/jdoan5/stockroom:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
